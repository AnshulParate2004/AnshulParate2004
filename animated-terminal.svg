<svg width="980" height="260" viewBox="0 0 980 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated terminal banner for Anshul Parate</title>
  <desc id="desc">A terminal styled GitHub profile banner with animated typing, glowing skill pills, and a scanner line.</desc>
  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #111827; stroke: #2dd4bf; stroke-opacity: .45; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .muted { fill: #94a3b8; font: 500 18px Consolas, Monaco, monospace; }
    .prompt { fill: #22c55e; font: 700 22px Consolas, Monaco, monospace; }
    .typed { fill: #e5e7eb; font: 700 22px Consolas, Monaco, monospace; }
    .name { font: 800 48px Segoe UI, Arial, sans-serif; fill: url(#nameGradient); }
    .role { fill: #67e8f9; font: 700 21px Segoe UI, Arial, sans-serif; }
    .pill { fill: #172554; stroke: #38bdf8; stroke-opacity: .45; }
    .pillText { fill: #dbeafe; font: 700 15px Segoe UI, Arial, sans-serif; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    .scan { animation: scan 4s ease-in-out infinite; opacity: .55; }
    .float { animation: float 3.6s ease-in-out infinite; }
    .delay1 { animation-delay: .25s; }
    .delay2 { animation-delay: .55s; }
    .delay3 { animation-delay: .85s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-32px); opacity: 0; } 20%, 80% { opacity: .55; } 100% { transform: translateY(235px); opacity: 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  </style>
  <defs>
    <linearGradient id="nameGradient" x1="90" y1="0" x2="870" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animate attributeName="x1" values="0;160;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="820;980;820" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="20" y="20" width="940" height="220" rx="22"/></clipPath>
  </defs>
  <rect class="bg" width="980" height="260" rx="26"/>
  <g clip-path="url(#clip)">
    <rect class="panel" x="20" y="20" width="940" height="220" rx="22"/>
    <rect class="scan" x="20" y="24" width="940" height="4" fill="url(#scanGradient)"/>
    <circle class="dot-red" cx="54" cy="50" r="7"/>
    <circle class="dot-yellow" cx="78" cy="50" r="7"/>
    <circle class="dot-green" cx="102" cy="50" r="7"/>
    <text class="muted" x="132" y="57">anshul@github-profile:~</text>
    <text class="prompt" x="54" y="99">$</text>
    <text class="typed" x="82" y="99">cat README.md</text>
    <rect class="cursor" x="268" y="78" width="12" height="27" fill="#e5e7eb"/>
    <text class="name" x="54" y="157">Anshul Parate</text>
    <text class="role" x="56" y="191">AI/ML Developer | Full-Stack Builder | Agentic AI Explorer</text>
    <g class="float" transform="translate(690 82)">
      <rect class="pill" width="86" height="34" rx="17"/>
      <text class="pillText" x="18" y="23">React</text>
    </g>
    <g class="float delay1" transform="translate(790 82)">
      <rect class="pill" width="112" height="34" rx="17"/>
      <text class="pillText" x="18" y="23">FastAPI</text>
    </g>
    <g class="float delay2" transform="translate(690 130)">
      <rect class="pill" width="112" height="34" rx="17"/>
      <text class="pillText" x="18" y="23">LangGraph</text>
    </g>
    <g class="float delay3" transform="translate(818 130)">
      <rect class="pill" width="84" height="34" rx="17"/>
      <text class="pillText" x="18" y="23">RAG</text>
    </g>
    <text class="muted" x="56" y="224">Building practical AI systems from research-heavy ideas.</text>
  </g>
</svg>
