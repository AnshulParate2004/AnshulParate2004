<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anshul Parate blue animated GitHub profile banner</title>
  <desc id="desc">A clean blue terminal-style animated GitHub profile banner for Anshul Parate.</desc>
  <style>
    .bg { fill: #050b16; }
    .frame { fill: #071827; stroke: url(#border); stroke-width: 2; }
    .grid { stroke: #153452; stroke-width: 1; opacity: .45; }
    .scan { animation: scan 4.8s ease-in-out infinite; opacity: .55; }
    .orb { fill: url(#orb); opacity: .45; }
    .prompt { fill: #38bdf8; font: 800 13px Consolas, Monaco, monospace; }
    .muted { fill: #8fb6d8; font: 700 13px Consolas, Monaco, monospace; }
    .cmd { fill: #7dd3fc; font: 900 13px Consolas, Monaco, monospace; }
    .hello { fill: #e0f2fe; font: 900 23px Consolas, Monaco, monospace; }
    .name { fill: url(#name); font: 900 60px 'Segoe UI', Arial, sans-serif; letter-spacing: 0; filter: url(#glow); }
    .role { fill: #67e8f9; font: 900 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 0; }
    .box { fill: #08233a; stroke: #1e6091; }
    .quote { fill: #e0f2fe; font: 800 14px Consolas, Monaco, monospace; }
    .section { fill: #93c5fd; font: 900 15px 'Segoe UI', Arial, sans-serif; }
    .body { fill: #cbd5e1; font: 700 13px 'Segoe UI', Arial, sans-serif; }
    .chip { fill: #082f49; stroke: #38bdf8; stroke-width: 1.2; }
    .chipText { fill: #dbeafe; font: 800 12px 'Segoe UI', Arial, sans-serif; }
    .card { fill: #071423; stroke: #1e6091; filter: url(#shadow); }
    .cardTop { fill: #0b253d; }
    .cardTitle { fill: #e0f2fe; font: 900 18px 'Segoe UI', Arial, sans-serif; }
    .label { fill: #93c5fd; font: 900 11px 'Segoe UI', Arial, sans-serif; }
    .value { fill: #f8fafc; font: 900 15px 'Segoe UI', Arial, sans-serif; }
    .code { font: 700 11px Consolas, Monaco, monospace; }
    .small { fill: #9ec8e8; font: 700 12px Consolas, Monaco, monospace; }
    .cursor { animation: blink 1s steps(2,start) infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
    .bar1 { animation: grow 4s ease-in-out infinite; transform-origin: left; }
    .bar2 { animation: grow 4s .5s ease-in-out infinite; transform-origin: left; }
    .bar3 { animation: grow 4s 1s ease-in-out infinite; transform-origin: left; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes grow { 0%,100% { transform: scaleX(.2); opacity: .45; } 50% { transform: scaleX(1); opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(-28px); opacity: 0; } 20%,80% { opacity: .55; } 100% { transform: translateY(492px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="border" x1="18" y1="18" x2="982" y2="502" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="name" x1="55" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0f9ff"/>
      <stop offset=".45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
      <animate attributeName="x1" values="0;120;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="470;640;470" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-35%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#38bdf8" flood-opacity=".45"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".4"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path class="grid" d="M28 0H0V28"/>
    </pattern>
  </defs>

  <rect class="bg" width="1000" height="520" rx="26"/>
  <rect class="frame" x="18" y="18" width="964" height="484" rx="24"/>
